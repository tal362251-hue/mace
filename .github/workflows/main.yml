name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1
          # This tells the Gradle action where to find your settings.gradle file
          build-root-directory: "mace hud mod source"

      # Navigates into your folder and runs the build command
      - run: |
          cd "mace hud mod source"
          gradle build --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: mace-hud-mod
          # Tells the uploader to look inside the subfolder's build directory
          path: "mace hud mod source/build/libs/*.jar"
