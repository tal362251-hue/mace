name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1
      - name: Build
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "NO settings.gradle FOUND. Files in repo:"; find . -not -path './.git/*' | head -60; exit 1; fi
          cd "$(dirname "$F")"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mace-hud-mod
          path: "**/build/libs/*.jar"
